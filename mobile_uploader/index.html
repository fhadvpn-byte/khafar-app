<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>رفع ملفات الجوال</title>
  <style>
    :root { --bg:#0E2920; --gold:#D4AF37; --text:#FFFFFF; --muted:#D1D5DB; --card:#13382B; }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      height: auto !important;
      min-height: 0 !important;
      display: block !important;
      overflow-x: hidden !important;
      overflow-y: visible !important;
      background: transparent !important;
      font-family: Cairo, Tahoma, sans-serif;
      color: var(--text);
      box-sizing: border-box !important;
    }
    #uploaderRoot {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      gap: 8px;
      padding: 8px 6px 12px 6px;
      box-sizing: border-box;
      width: 100%;
    }
    #uploaderCard {
      background: var(--bg);
      border: 1.5px solid rgba(212,175,55,0.45);
      border-radius: 14px;
      padding: 10px;
      margin: 0;
      box-sizing: border-box;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
    }
    #uploaderTop {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sub {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin: 0;
      line-height: 1.4;
      text-align: right;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: stretch;
      align-items: stretch;
      flex: 0 0 auto;
      position: relative;
      z-index: 5;
    }
    .actions label.btn,
    .actions button.btn {
      flex: 1 1 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--gold);
      background: linear-gradient(135deg, #146C4E 0%, #0D4A35 100%);
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      border-radius: 10px;
      padding: 11px 8px;
      font-weight: 800;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      min-height: 46px;
      box-sizing: border-box;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      text-shadow: 0 1px 1px rgba(0,0,0,0.35);
    }
    .actions button.btn.clear-all {
      flex: 0 0 auto;
      min-width: 96px;
      background: #7f1d1d;
      border-color: #fca5a5;
      font-size: 12px;
      min-height: 40px;
    }
    .actions label.btn.secondary {
      background: #0A211A;
      border-color: rgba(212,175,55,0.55);
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
    }
    .actions label.btn.disabled,
    .actions button.btn.disabled {
      opacity: .45;
      pointer-events: none;
      cursor: not-allowed;
    }
    .drop {
      border: 1.5px dashed rgba(212,175,55,0.45);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
      background: rgba(10,33,26,0.55);
      font-size: 12px;
      font-weight: 700;
      color: #E5E7EB;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .drop.over { border-color: var(--gold); background: rgba(20,108,78,0.25); color: #fff; }
    #thumbsWrap {
      flex: 0 1 auto;
      max-height: 200px;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-top: 2px;
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    .thumb {
      position: relative;
      width: 100%;
      background: #0A211A;
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 10px;
      overflow: visible;
      padding-bottom: 4px;
      box-sizing: border-box;
    }
    .thumb img {
      width: 100%;
      height: 72px;
      object-fit: cover;
      display: block;
      background: #fff;
      border-radius: 10px 10px 0 0;
    }
    .thumb .pdf {
      width: 100%;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: #0A211A;
      border-radius: 10px 10px 0 0;
    }
    .thumb .name {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 5px 0;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: ltr;
      text-align: center;
    }
    .thumb .rm {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 999px;
      background: rgba(127,29,29,0.95);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      line-height: 24px;
      padding: 0;
      font-size: 13px;
      z-index: 2;
    }
    .ok { margin: 0; font-size: 12px; font-weight: 800; color: #86efac; min-height: 14px; text-align: right; flex: 0 0 auto; }
    .err { color: #fca5a5; }
    .file-inputs input[type="file"] {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
    }
  </style>
</head>
<body>
  <div id="uploaderRoot">
    <div id="uploaderCard">
      <div id="uploaderTop">
        <div class="sub" id="subtitle">المعرض أو الكاميرا — متوافق مع أندرويد والآيفون</div>
        <div class="actions">
          <label class="btn" id="lblGallery" for="inp_gallery">🖼️ معرض الصور</label>
          <label class="btn" id="lblCamera" for="inp_cam">📷 الكاميرا</label>
          <label class="btn secondary" id="lblPdf" for="inp_pdf" hidden>📄 ملف PDF</label>
          <button type="button" class="btn clear-all" id="btnClearAll" hidden>🗑️ مسح الكل</button>
        </div>
        <div class="drop" id="dropZone" role="button" tabindex="0">أسقط الملفات هنا أو اضغط لفتح المعرض</div>
      </div>
      <div id="thumbsWrap"><div class="thumbs" id="thumbs"></div></div>
      <div class="ok" id="status"></div>
    </div>
  </div>

  <div class="file-inputs" aria-hidden="true">
    <input type="file" id="inp_gallery" accept="image/*" />
    <input type="file" id="inp_cam" accept="image/*" capture="environment" />
    <input type="file" id="inp_pdf" accept="application/pdf,.pdf,image/*" />
  </div>

  <script>
(function () {
  var MAX_EDGE = 1600;
  var JPEG_Q = 0.85;
  var files = [];
  var cfg = { title: "", subtitle: "", multiple: true, allow_pdf: true, preserve_alpha: false, disabled: false };
  var bootstrapped = false;
  var lastArgsSig = "";
  var lastHeight = 0;
  var lastWidth = window.innerWidth || 0;
  var renderSeen = false;
  var jitterOn = false;

  var rootEl = document.getElementById("uploaderRoot");
  var cardEl = document.getElementById("uploaderCard");
  var subEl = document.getElementById("subtitle");
  var dropZone = document.getElementById("dropZone");
  var thumbsEl = document.getElementById("thumbs");
  var statusEl = document.getElementById("status");
  var lblGallery = document.getElementById("lblGallery");
  var lblCamera = document.getElementById("lblCamera");
  var lblPdf = document.getElementById("lblPdf");
  var btnClearAll = document.getElementById("btnClearAll");
  var inpGallery = document.getElementById("inp_gallery");
  var inpCamera = document.getElementById("inp_cam");
  var inpPdf = document.getElementById("inp_pdf");

  function send(type, data) {
    var msg = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
    try { window.parent.postMessage(msg, "*"); } catch (e) {}
  }
  function setReady() { send("streamlit:componentReady", { apiVersion: 1 }); }

  function syncUploaderHeight(forceJitter) {
    var measure = rootEl || cardEl || document.body;
    var rect = measure.getBoundingClientRect();
    var h = Math.ceil(Math.max(rect.height || 0, measure.scrollHeight || 0, measure.offsetHeight || 0) + 22);
    h = Math.max(180, Math.min(h, 720));
    if (forceJitter) {
      jitterOn = !jitterOn;
      h = h + (jitterOn ? 1 : 0);
    } else if (lastHeight && Math.abs(h - lastHeight) <= 1) {
      return;
    }
    lastHeight = h;
    send("streamlit:setFrameHeight", { height: h });
  }
  function bumpHeight() {
    syncUploaderHeight(true);
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(function () { syncUploaderHeight(true); });
    }
    setTimeout(function () { syncUploaderHeight(true); }, 80);
    setTimeout(function () { syncUploaderHeight(true); }, 250);
  }

  function setValue(value) {
    send("streamlit:setComponentValue", { value: value, dataType: "json" });
  }
  function uid() {
    return "f_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }
  function abToB64(buf) {
    var bytes = new Uint8Array(buf);
    var chunk = 0x8000;
    var binary = "";
    for (var i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }
  function updateClearBtn() {
    if (!btnClearAll) return;
    btnClearAll.hidden = !files.length;
    btnClearAll.classList.toggle("disabled", !!cfg.disabled);
    btnClearAll.disabled = !!cfg.disabled;
  }
  function currentPayload() {
    return files.map(function (f) {
      return { name: f.name, type: f.type, size: f.size, data_b64: f.data_b64, id: f.id };
    });
  }
  function emit() {
    var payload = currentPayload();
    var value = { action: "update", files: payload, ts: Date.now() };
    // إرسال مزدوج يضمن وصول القيمة من أول نقرة قبل أي remount
    setValue(value);
    setTimeout(function () {
      setValue({ action: "update", files: currentPayload(), ts: Date.now() });
    }, 40);
    renderThumbs();
    updateClearBtn();
    statusEl.className = "ok";
    statusEl.textContent = files.length ? ("✅ تم تجهيز " + files.length + " مرفق") : "";
    bumpHeight();
  }
  function renderThumbs() {
    thumbsEl.innerHTML = "";
    files.forEach(function (f) {
      var card = document.createElement("div");
      card.className = "thumb";
      if ((f.type || "").indexOf("pdf") !== -1 || /\.pdf$/i.test(f.name || "")) {
        var pdf = document.createElement("div");
        pdf.className = "pdf";
        pdf.textContent = "📄";
        card.appendChild(pdf);
      } else {
        var img = document.createElement("img");
        img.alt = f.name || "صورة";
        img.onload = function () { bumpHeight(); };
        img.onerror = function () { syncUploaderHeight(true); };
        img.src = f.preview || ("data:" + (f.type || "image/jpeg") + ";base64," + f.data_b64);
        card.appendChild(img);
      }
      var nm = document.createElement("div");
      nm.className = "name";
      nm.textContent = f.name || "ملف";
      card.appendChild(nm);
      var rm = document.createElement("button");
      rm.type = "button";
      rm.className = "rm";
      rm.textContent = "✕";
      rm.onclick = function (ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        files = files.filter(function (x) { return x.id !== f.id; });
        emit();
      };
      card.appendChild(rm);
      thumbsEl.appendChild(card);
    });
    syncUploaderHeight(true);
  }

  function loadImageBitmap(file) {
    return new Promise(function (resolve, reject) {
      if (window.createImageBitmap) {
        createImageBitmap(file).then(resolve).catch(function () {
          var url = URL.createObjectURL(file);
          var img = new Image();
          img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
          img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("decode")); };
          img.src = url;
        });
        return;
      }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src = url;
    });
  }
  function canvasToB64(canvas, mime, quality) {
    return new Promise(function (resolve, reject) {
      if (canvas.toBlob) {
        canvas.toBlob(function (blob) {
          if (!blob) { reject(new Error("blob")); return; }
          blob.arrayBuffer().then(function (ab) {
            resolve({ b64: abToB64(ab), type: blob.type || mime, size: blob.size });
          }).catch(reject);
        }, mime, quality);
        return;
      }
      try {
        var dataUrl = canvas.toDataURL(mime, quality);
        var b64 = dataUrl.split(",")[1] || "";
        resolve({ b64: b64, type: mime, size: Math.floor(b64.length * 0.75) });
      } catch (e) { reject(e); }
    });
  }
  function processImageFile(file) {
    return loadImageBitmap(file).then(function (bmp) {
      var w = bmp.width || bmp.naturalWidth || 1;
      var h = bmp.height || bmp.naturalHeight || 1;
      var scale = Math.min(1, MAX_EDGE / Math.max(w, h));
      var tw = Math.max(1, Math.round(w * scale));
      var th = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement("canvas");
      canvas.width = tw; canvas.height = th;
      var ctx = canvas.getContext("2d");
      if (cfg.preserve_alpha) {
        ctx.clearRect(0, 0, tw, th);
        ctx.drawImage(bmp, 0, 0, tw, th);
        return canvasToB64(canvas, "image/png").then(function (out) {
          return { id: uid(), name: (file.name || "توقيع").replace(/\.[^.]+$/, "") + ".png", type: "image/png", size: out.size, data_b64: out.b64, preview: "data:image/png;base64," + out.b64 };
        });
      }
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, tw, th);
      ctx.drawImage(bmp, 0, 0, tw, th);
      return canvasToB64(canvas, "image/jpeg", JPEG_Q).then(function (out) {
        var stem = (file.name || "صورة").replace(/\.[^.]+$/, "");
        return { id: uid(), name: stem + ".jpg", type: "image/jpeg", size: out.size, data_b64: out.b64, preview: "data:image/jpeg;base64," + out.b64 };
      });
    }).catch(function () {
      return file.arrayBuffer().then(function (ab) {
        return { id: uid(), name: file.name || ("raw_" + Date.now() + ".heic"), type: file.type || "application/octet-stream", size: file.size || ab.byteLength, data_b64: abToB64(ab), preview: "" };
      });
    });
  }
  function processPdfFile(file) {
    return file.arrayBuffer().then(function (ab) {
      var name = file.name || ("مرفق_" + Date.now() + ".pdf");
      if (!/\.pdf$/i.test(name)) name += ".pdf";
      return { id: uid(), name: name, type: "application/pdf", size: file.size || ab.byteLength, data_b64: abToB64(ab), preview: "" };
    });
  }
  function processOne(file) {
    var type = (file && file.type) || "";
    var name = (file && file.name) || "";
    if (type === "application/pdf" || /\.pdf$/i.test(name)) {
      if (!cfg.allow_pdf) {
        statusEl.className = "ok err";
        statusEl.textContent = "⚠️ رفع PDF غير مفعّل لهذا الحقل.";
        return Promise.resolve(null);
      }
      return processPdfFile(file);
    }
    return processImageFile(file);
  }
  function ingestFileList(list) {
    if (cfg.disabled) return;
    var arr = Array.prototype.slice.call(list || []);
    if (!arr.length) return;
    statusEl.className = "ok";
    statusEl.textContent = "⏳ جارِ تجهيز الملفات...";
    bumpHeight();
    var chain = Promise.resolve();
    arr.forEach(function (file) {
      chain = chain.then(function () {
        return processOne(file).then(function (item) {
          if (!item) return;
          if (!cfg.multiple) files = [item];
          else files.push(item);
        });
      });
    });
    chain.then(emit).catch(function () {
      statusEl.className = "ok err";
      statusEl.textContent = "⚠️ تعذّر قراءة بعض الملفات من المعرض.";
      emit();
    });
  }
  function bindInput(inp) {
    inp.addEventListener("change", function () {
      ingestFileList(inp.files);
      try { inp.value = ""; } catch (e) {}
    });
  }
  bindInput(inpGallery); bindInput(inpCamera); bindInput(inpPdf);
  if (btnClearAll) {
    btnClearAll.addEventListener("click", function (ev) {
      if (ev) { ev.preventDefault(); ev.stopPropagation(); }
      if (cfg.disabled) return;
      files = [];
      emit();
    });
  }
  function openGallery() {
    if (cfg.disabled) return;
    try { inpGallery.click(); } catch (e) {}
  }
  dropZone.addEventListener("click", function (ev) { ev.preventDefault(); openGallery(); });
  dropZone.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openGallery(); }
  });
  ;["dragenter", "dragover"].forEach(function (evName) {
    dropZone.addEventListener(evName, function (ev) { ev.preventDefault(); ev.stopPropagation(); dropZone.classList.add("over"); });
  });
  ;["dragleave", "drop"].forEach(function (evName) {
    dropZone.addEventListener(evName, function (ev) { ev.preventDefault(); ev.stopPropagation(); dropZone.classList.remove("over"); });
  });
  dropZone.addEventListener("drop", function (ev) {
    if (cfg.disabled) return;
    ingestFileList(ev.dataTransfer && ev.dataTransfer.files);
  });

  function applyArgs(args) {
    args = args || {};
    var sig = JSON.stringify({
      subtitle: args.subtitle || args.title || "",
      multiple: !!args.multiple,
      allow_pdf: args.allow_pdf !== false && args.allow_pdf !== 0 && args.allow_pdf !== "false",
      preserve_alpha: !!args.preserve_alpha,
      disabled: !!args.disabled
    });
    if (sig === lastArgsSig && bootstrapped) return;
    lastArgsSig = sig;
    cfg.subtitle = String(args.subtitle || args.title || "المعرض أو الكاميرا — متوافق مع أندرويد والآيفون");
    cfg.multiple = !!args.multiple;
    cfg.allow_pdf = args.allow_pdf !== false && args.allow_pdf !== 0 && args.allow_pdf !== "false";
    cfg.preserve_alpha = !!args.preserve_alpha;
    cfg.disabled = !!args.disabled;
    subEl.textContent = cfg.subtitle;
    lblPdf.hidden = !cfg.allow_pdf;
    lblGallery.classList.toggle("disabled", cfg.disabled);
    lblCamera.classList.toggle("disabled", cfg.disabled);
    lblPdf.classList.toggle("disabled", cfg.disabled || !cfg.allow_pdf);
    updateClearBtn();
    inpGallery.multiple = !!cfg.multiple;
    inpPdf.multiple = !!cfg.multiple;
    inpGallery.disabled = !!cfg.disabled;
    inpCamera.disabled = !!cfg.disabled;
    inpPdf.disabled = !!cfg.disabled || !cfg.allow_pdf;
    bootstrapped = true;
  }

  window.addEventListener("message", function (ev) {
    var data = ev.data || {};
    if (!data || data.type !== "streamlit:render") return;
    renderSeen = true;
    applyArgs(data.args || {});
    bumpHeight();
  });
  window.addEventListener("resize", function () {
    var w = window.innerWidth || 0;
    if (w === lastWidth) return;
    lastWidth = w;
    if (renderSeen) bumpHeight();
  });
  if (typeof ResizeObserver !== "undefined") {
    try {
      var ro = new ResizeObserver(function () { syncUploaderHeight(true); });
      if (rootEl) ro.observe(rootEl);
      if (cardEl) ro.observe(cardEl);
    } catch (e) {}
  }
  setReady();
  bumpHeight();
})();
  </script>
</body>
</html>
