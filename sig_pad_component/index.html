<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>لوحة التوقيع</title>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      height: 310px !important;
      max-height: 310px !important;
      min-height: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
      font-family: Cairo, Tahoma, sans-serif;
      color: #e2e8f0;
    }
    #padCard {
      background: #101820;
      border: 1px solid var(--accent, #1e6b50);
      border-radius: 12px;
      padding: 8px 10px 10px;
      margin: 2px;
      box-sizing: border-box;
      height: 306px;
      overflow: hidden;
    }
    .title {
      font-weight: 800;
      color: #f3cc7a;
      font-size: 13px;
      margin: 0 0 4px;
      text-align: center;
      line-height: 1.35;
    }
    .sub {
      color: #94a3b8;
      font-size: 11px;
      text-align: center;
      margin: 0 0 4px;
      line-height: 1.35;
      min-height: 0;
    }
    .badge {
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.4;
      min-height: 20px;
      margin: 0 0 6px;
      color: #94a3b8;
    }
    .badge.signing { color: #f3cc7a; }
    .badge.saved { color: #34d399; }
    .badge.ready { color: #93c5fd; }
    canvas {
      width: 100%;
      height: 168px;
      border: 1.5px dashed var(--accent, #0038A8);
      border-radius: 8px;
      background: #ffffff;
      touch-action: none;
      -ms-touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      cursor: crosshair;
      display: block;
      overscroll-behavior: none;
    }
    .actions {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }
    button {
      border: 1px solid #d4a853;
      background: #112924;
      color: #fff;
      border-radius: 10px;
      padding: 11px 18px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      min-height: 44px;
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>
<body>
  <div id="padCard">
    <div class="title" id="padTitle">ارسم التوقيع هنا (حبر أزرق رسمي #0038A8)</div>
    <div class="sub" id="padSub"></div>
    <div class="badge ready" id="padStatus">جاهزة للتوقيع الجديد</div>
    <canvas id="pad" width="900" height="220" tabindex="-1"></canvas>
    <div class="actions">
      <button type="button" id="btnClear">🧹 مسح التوقيع</button>
    </div>
  </div>
  <script>
(function () {
  var INK = "#0038A8";
  var INK_RGB = { r: 0, g: 56, b: 168 };
  var CANVAS_W = 900;
  var CANVAS_H = 220;
  var FRAME_H = 310;
  var DEBOUNCE_MS = 700;
  var CROP_PAD = 12;
  var canvas = document.getElementById("pad");
  var ctx = canvas.getContext("2d", { willReadFrequently: true });
  var statusEl = document.getElementById("padStatus");
  var titleEl = document.getElementById("padTitle");
  var subEl = document.getElementById("padSub");
  var drawing = false;
  var lastX = 0, lastY = 0, midX = 0, midY = 0;
  var lastTouchTs = 0;
  var hasInk = false;
  var lsKey = "khafar_duty_sig";
  var padId = "officer";
  var restoring = false;
  var lastSavedArg = "";
  var saveTimer = null;
  var lastSentFp = "";
  var heightSent = false;
  var justCleared = false;

  function send(type, data) {
    var msg = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
    try { window.parent.postMessage(msg, "*"); } catch (e) {}
  }
  function setReady() { send("streamlit:componentReady", { apiVersion: 1 }); }
  function setHeight() {
    if (heightSent) return;
    heightSent = true;
    send("streamlit:setFrameHeight", { height: FRAME_H });
  }
  function setValue(value) {
    send("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  function setStatus(kind) {
    statusEl.className = "badge " + (kind || "ready");
    if (kind === "signing") statusEl.textContent = "✍️ جاري التوقيع...";
    else if (kind === "saved") statusEl.textContent = "✅ تم اعتماد وحفظ التوقيع تلقائياً";
    else if (isDocScopedKey(lsKey) && !isOfficialPadId(padId)) statusEl.textContent = "✍️ بانتظار التوقيع...";
    else statusEl.textContent = "جاهزة للتوقيع الجديد";
  }

  function posFromClient(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    var rw = r.width || CANVAS_W;
    var rh = r.height || CANVAS_H;
    return {
      x: (clientX - r.left) * (CANVAS_W / rw),
      y: (clientY - r.top) * (CANVAS_H / rh)
    };
  }
  function posFromEvent(e) {
    var src = e;
    if (e.touches && e.touches.length) src = e.touches[0];
    else if (e.changedTouches && e.changedTouches.length) src = e.changedTouches[0];
    return posFromClient(src.clientX, src.clientY);
  }

  function canvasHasInk() {
    try {
      var data = ctx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
      for (var i = 3; i < data.length; i += 16) {
        if (data[i] > 18) return true;
      }
    } catch (e) {}
    return false;
  }

  function inkFingerprint() {
    try {
      var d = ctx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
      var h = 2166136261;
      for (var i = 3; i < d.length; i += 48) {
        h ^= d[i];
        h = Math.imul(h, 16777619);
        h ^= d[i - 1] || 0;
      }
      return String(h >>> 0);
    } catch (e) {
      return "";
    }
  }

  function cancelAutoSave() {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
    }
  }

  function strokeWidth() {
    var r = canvas.getBoundingClientRect();
    var scaleX = CANVAS_W / Math.max(1, r.width || CANVAS_W);
    var screenTarget = (window.innerWidth || 800) >= 900 ? 4.2 : 3.8;
    var w = screenTarget * scaleX;
    if (w < 3.6) w = 3.6;
    if (w > 9.5) w = 9.5;
    return w;
  }
  function beginDraw(pt) {
    cancelAutoSave();
    drawing = true;
    hasInk = true;
    lastX = pt.x; lastY = pt.y; midX = pt.x; midY = pt.y;
    setStatus("signing");
    var lw = strokeWidth();
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, Math.max(1.8, lw * 0.48), 0, Math.PI * 2);
    ctx.fill();
  }
  function moveDraw(pt) {
    if (!drawing) return;
    var nextMidX = (lastX + pt.x) / 2;
    var nextMidY = (lastY + pt.y) / 2;
    ctx.strokeStyle = INK;
    ctx.lineWidth = strokeWidth();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(midX, midY);
    ctx.quadraticCurveTo(lastX, lastY, nextMidX, nextMidY);
    ctx.stroke();
    lastX = pt.x; lastY = pt.y; midX = nextMidX; midY = nextMidY;
  }
  function endDraw() {
    drawing = false;
    scheduleAutoSave();
  }

  function scheduleAutoSave() {
    cancelAutoSave();
    if (!hasInk && !canvasHasInk()) return;
    setStatus("signing");
    saveTimer = setTimeout(commitAutoSave, DEBOUNCE_MS);
  }

  function isDocScopedKey(key) {
    return String(key || "").indexOf("khafar_doc_sig::") === 0;
  }
  function isOfficialPadId(id) {
    return id === "officer" || id === "duty" || id === "manager";
  }
  function persistLocal(dataUrl) {
    var raw = "";
    if (dataUrl && dataUrl.indexOf(",") !== -1) raw = dataUrl.split(",")[1] || "";
    if (isDocScopedKey(lsKey)) {
      /* تواقيع الأطراف داخل النماذج: sessionStorage فقط ومرتبطة بـ nonce الوثيقة */
      try { if (lsKey) sessionStorage.setItem(lsKey, raw || dataUrl || ""); } catch (e) {}
      return;
    }
    try { if (lsKey) localStorage.setItem(lsKey, raw || dataUrl || ""); } catch (e) {}
    try { if (padId) localStorage.setItem("pad_" + padId, dataUrl || ""); } catch (e) {}
  }
  function clearLocal() {
    if (isDocScopedKey(lsKey)) {
      try { if (lsKey) sessionStorage.removeItem(lsKey); } catch (e) {}
      try { if (lsKey) localStorage.removeItem(lsKey); } catch (e2) {}
      return;
    }
    try { if (lsKey) localStorage.removeItem(lsKey); } catch (e) {}
    try { if (padId) localStorage.removeItem("pad_" + padId); } catch (e) {}
  }
  function readLocal() {
    var v = "";
    if (isDocScopedKey(lsKey)) {
      try { v = sessionStorage.getItem(lsKey) || ""; } catch (e) {}
      if (!v) return "";
      if (v.indexOf("data:image") === 0) return v;
      return "data:image/png;base64," + v;
    }
    try { v = localStorage.getItem("pad_" + padId) || ""; } catch (e) {}
    if (!v) {
      try { v = localStorage.getItem(lsKey) || ""; } catch (e2) {}
    }
    if (!v) return "";
    if (v.indexOf("data:image") === 0) return v;
    return "data:image/png;base64," + v;
  }
  function purgeStaleDocSigKeys() {
    if (!isDocScopedKey(lsKey)) return;
    var prefix = "khafar_doc_sig::";
    var keepPrefix = lsKey.split("::").slice(0, 2).join("::") + "::";
    function wipe(store) {
      if (!store) return;
      try {
        var kill = [];
        for (var i = 0; i < store.length; i++) {
          var k = store.key(i);
          if (!k) continue;
          if (k.indexOf(prefix) === 0 && k.indexOf(keepPrefix) !== 0) kill.push(k);
          if (k.indexOf("khafar_doc_sig_") === 0) kill.push(k);
          if (k.indexOf("khafar_pad_") === 0) kill.push(k);
          if (!isOfficialPadId(padId) && /^pad_(citizen|p\d+|guarantor|bailed|receiver|agent|observer)$/.test(k)) kill.push(k);
        }
        for (var j = 0; j < kill.length; j++) {
          try { store.removeItem(kill[j]); } catch (e) {}
        }
      } catch (e2) {}
    }
    wipe(window.sessionStorage);
    wipe(window.localStorage);
  }

  function exportPng() {
    var src = ctx.getImageData(0, 0, CANVAS_W, CANVAS_H).data;
    var minX = CANVAS_W, minY = CANVAS_H, maxX = -1, maxY = -1;
    for (var y = 0; y < CANVAS_H; y++) {
      for (var x = 0; x < CANVAS_W; x++) {
        var i = (y * CANVAS_W + x) * 4;
        var a = src[i + 3];
        var r = src[i], g = src[i + 1], b = src[i + 2];
        var isInk = a > 20 || Math.min(r, g, b) < 235 || (b - r > 25);
        if (!isInk) continue;
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
    if (maxX < 0) {
      var empty = document.createElement("canvas");
      empty.width = 8;
      empty.height = 8;
      return empty.toDataURL("image/png");
    }
    minX = Math.max(0, minX - CROP_PAD);
    minY = Math.max(0, minY - CROP_PAD);
    maxX = Math.min(CANVAS_W - 1, maxX + CROP_PAD);
    maxY = Math.min(CANVAS_H - 1, maxY + CROP_PAD);
    var cw = maxX - minX + 1;
    var ch = maxY - minY + 1;
    var out = document.createElement("canvas");
    out.width = cw;
    out.height = ch;
    var octx = out.getContext("2d");
    octx.clearRect(0, 0, cw, ch);
    octx.drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
    var id = octx.getImageData(0, 0, cw, ch);
    var d = id.data;
    for (var j = 0; j < d.length; j += 4) {
      if (d[j + 3] > 20 || Math.min(d[j], d[j + 1], d[j + 2]) < 235 || (d[j + 2] - d[j] > 25)) {
        d[j] = INK_RGB.r;
        d[j + 1] = INK_RGB.g;
        d[j + 2] = INK_RGB.b;
        d[j + 3] = 255;
      } else {
        d[j] = 0;
        d[j + 1] = 0;
        d[j + 2] = 0;
        d[j + 3] = 0;
      }
    }
    octx.putImageData(id, 0, 0);
    return out.toDataURL("image/png");
  }

  function commitAutoSave() {
    saveTimer = null;
    if (drawing || restoring) return;
    if (!hasInk && !canvasHasInk()) return;
    var fp = inkFingerprint();
    if (fp && fp === lastSentFp) return;
    var dataUrl = exportPng();
    persistLocal(dataUrl);
    lastSentFp = fp;
    setStatus("saved");
    setValue({
      action: "save",
      data_url: dataUrl,
      pad_id: padId,
      ts: Date.now(),
      fp: fp
    });
  }

  function onTouchStart(ev) {
    lastTouchTs = Date.now();
    if (ev.cancelable) ev.preventDefault();
    ev.stopPropagation();
    beginDraw(posFromEvent(ev));
  }
  function onTouchMove(ev) {
    lastTouchTs = Date.now();
    if (!drawing) return;
    if (ev.cancelable) ev.preventDefault();
    ev.stopPropagation();
    moveDraw(posFromEvent(ev));
  }
  function onTouchEnd(ev) {
    lastTouchTs = Date.now();
    if (ev.cancelable) ev.preventDefault();
    ev.stopPropagation();
    endDraw();
  }

  canvas.addEventListener("touchstart", onTouchStart, { passive: false });
  canvas.addEventListener("touchmove", onTouchMove, { passive: false });
  canvas.addEventListener("touchend", onTouchEnd, { passive: false });
  canvas.addEventListener("touchcancel", onTouchEnd, { passive: false });

  canvas.addEventListener("pointerdown", function (ev) {
    if (ev.pointerType === "touch") return;
    if (ev.cancelable) ev.preventDefault();
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    beginDraw(posFromClient(ev.clientX, ev.clientY));
  }, { passive: false });
  canvas.addEventListener("pointermove", function (ev) {
    if (ev.pointerType === "touch" || !drawing) return;
    if (ev.cancelable) ev.preventDefault();
    moveDraw(posFromClient(ev.clientX, ev.clientY));
  }, { passive: false });
  canvas.addEventListener("pointerup", function (ev) {
    if (ev.pointerType === "touch") return;
    endDraw();
  });
  canvas.addEventListener("mousedown", function (ev) {
    if (Date.now() - lastTouchTs < 650 || ev.button !== 0) return;
    ev.preventDefault();
    beginDraw(posFromClient(ev.clientX, ev.clientY));
  });
  canvas.addEventListener("mousemove", function (ev) {
    if (!drawing || Date.now() - lastTouchTs < 650) return;
    ev.preventDefault();
    moveDraw(posFromClient(ev.clientX, ev.clientY));
  });
  window.addEventListener("mouseup", function () {
    if (Date.now() - lastTouchTs < 650) return;
    endDraw();
  });

  function restoreFromUrl(url, done) {
    if (!url) { if (done) done(false); return; }
    restoring = true;
    var img = new Image();
    img.onload = function () {
      try {
        ctx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
        hasInk = canvasHasInk();
        lastSentFp = inkFingerprint();
        if (hasInk) setStatus("saved");
      } catch (e) {}
      restoring = false;
      if (done) done(true);
    };
    img.onerror = function () {
      restoring = false;
      if (done) done(false);
    };
    img.src = url;
  }

  document.getElementById("btnClear").onclick = function () {
    cancelAutoSave();
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    hasInk = false;
    drawing = false;
    lastSentFp = "";
    lastSavedArg = "";
    justCleared = true;
    clearLocal();
    setStatus("ready");
    setValue("__CLEARED__");
  };

  function applyArgs(args) {
    args = args || {};
    if (args.title) titleEl.textContent = String(args.title);
    if (args.subtitle !== undefined) subEl.textContent = String(args.subtitle || "");
    if (args.ls_key) lsKey = String(args.ls_key);
    if (args.pad_id) padId = String(args.pad_id);
    if (args.accent) {
      document.documentElement.style.setProperty("--accent", String(args.accent));
    }
    purgeStaleDocSigKeys();
    if (drawing || saveTimer) return;
    var saved = String(args.saved || "");
    if (saved && saved.indexOf("data:image") !== 0 && saved.length > 32) {
      saved = "data:image/png;base64," + saved;
    }
    if (justCleared) {
      if (!saved) justCleared = false;
      return;
    }
    if (hasInk || canvasHasInk()) return;
    if (saved && saved !== lastSavedArg) {
      lastSavedArg = saved;
      restoreFromUrl(saved);
      return;
    }
    /* لا تستعد توقيع طرف قديم من التخزين إذا لم يمرّر بايثون saved للوثيقة الحالية */
    if (isDocScopedKey(lsKey) && !saved) {
      setStatus("ready");
      return;
    }
    var local = readLocal();
    if (local) restoreFromUrl(local);
  }

  window.addEventListener("message", function (ev) {
    var data = ev.data || {};
    if (!data || data.type !== "streamlit:render") return;
    applyArgs(data.args || {});
  });

  setReady();
  setHeight();
})();
  </script>
</body>
</html>
